name: PR CI guard

# Cuando el CI de un PR falla (lint, build, prisma validate, tests o imágenes Docker), comenta en el PR
# qué jobs y pasos fallaron, cómo reproducirlo y lo cierra. Se reabre después de subir la corrección,
# lo que vuelve a lanzar el CI (issue #48).
#
# Se usa workflow_run en lugar de pull_request: así el token tiene permiso de escritura también para PRs
# que vienen de forks, y nunca se ejecuta código del PR con ese token.
# Nota: GitHub ejecuta los workflow_run desde la rama por defecto, así que entra en vigor al fusionarse en main.

on:
  workflow_run:
    workflows:
      - DataNexus CI/CD
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  close-failing-pr:
    name: Close PR with failing CI
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close the pull request
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // 1. PR asociado al commit que falló (los PR de forks no vienen en workflow_run.pull_requests).
            let number = run.pull_requests?.[0]?.number;
            if (!number) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: run.head_sha,
              });
              number = data.find((pr) => pr.state === 'open')?.number;
            }
            if (!number) {
              const { data } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:pr is:open ${run.head_sha}`,
              });
              number = data.items[0]?.number;
            }
            if (!number) {
              core.info(`No hay un PR abierto para ${run.head_sha}.`);
              return;
            }

            // 2. Solo actúa si el PR sigue abierto y el fallo es de su último commit (no de un push ya corregido).
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.head.sha !== run.head_sha) {
              core.info(`PR #${number} cerrado o con commits más nuevos: no se hace nada.`);
              return;
            }

            // 3. Jobs y pasos que fallaron.
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, per_page: 100,
            });
            const failed = jobs
              .filter((job) => job.conclusion === 'failure')
              .map((job) => {
                const steps = (job.steps ?? []).filter((step) => step.conclusion === 'failure').map((step) => step.name);
                return `- **${job.name}**${steps.length ? `: ${steps.map((name) => `\`${name}\``).join(', ')}` : ''} ([ver log](${job.html_url}))`;
              });

            const body = [
              '<!-- datanexus-ci-guard -->',
              `### ❌ El CI falló en \`${run.head_sha.slice(0, 7)}\` y este PR se cerró`,
              '',
              `@${pr.user.login}, el PR no puede fusionarse mientras el CI esté en rojo. Esto es lo que falló:`,
              '',
              ...(failed.length ? failed : [`- Revisa la ejecución completa: ${run.html_url}`]),
              '',
              '**Cómo repararlo**',
              '1. Reproduce el fallo en local con los mismos comandos del CI:',
              '   ```bash',
              '   cd backend',
              '   npm ci',
              '   npx prisma validate',
              '   npm run lint      # oxlint --type-aware, igual que el CI',
              '   npm run build',
              '   npm test',
              '   ```',
              '2. Corrige el código o los tests y sube los cambios a la misma rama.',
              '3. Pulsa **Reopen pull request**: el CI se ejecuta de nuevo con el último commit.',
              '',
              `_Ejecución: ${run.html_url}_`,
            ].join('\n');

            await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            await github.rest.pulls.update({ owner, repo, pull_number: number, state: 'closed' });
            core.notice(`PR #${number} cerrado por CI fallido.`);
