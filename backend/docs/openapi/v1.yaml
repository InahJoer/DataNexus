      description: >-
        Disponible para ADMIN y OPERADOR en PostgreSQL, MySQL, SQL Server y Firestore. Requiere el valor observado para
        rechazar cambios concurrentes; los conflictos devuelven 409.
      operationId: DataEngineController_updateRecord[0]
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecordDto'
