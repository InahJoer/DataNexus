      tags:
        - Consultas guardadas
  /queries/{id}/run:
    post:
      description: >-
        Ejecuta la definición con el mismo motor que POST /engine/join (límites, filtros y enmascaramiento por rol). El
        LECTOR solo puede ejecutar consultas publicadas. Se registra como EXECUTE_JOIN en la bitácora.
      operationId: SavedQueriesController_run
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunSavedQueryDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQueryRunResultDto'
        '401':
          description: Token JWT inválido o ausente.
        '404':
          description: Consulta, versión o conexión no encontrada.
        '413':
          description: El origen o el resultado supera los límites configurados.
        '422':
          description: La definición guardada ya no es válida.
        '502':
          description: Falló la extracción de una fuente externa.
        '504':
          description: La consulta a una fuente externa agotó el tiempo.
      security:
        - bearer: []
      summary: Ejecutar una consulta guardada
      tags:
        - Consultas guardadas
  /workspaces/me:
