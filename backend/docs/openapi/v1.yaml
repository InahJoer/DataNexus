  /engine/connections/{connectionId}/data:
    get:
      description: >-
        Devuelve una página y `nextCursor` para pedir la siguiente. Usa cursores nativos de cada motor (keyset sobre la
        llave primaria en SQL, `_id` en MongoDB, `startAfter` en Firestore): cualquier página cuesta lo mismo y la
        memoria es constante aunque la tabla tenga millones de filas (RNF-06). Las tablas SQL necesitan llave primaria.
      operationId: DataEngineController_browseData[0]
      parameters:
        - name: connectionId
          required: true
          in: path
          schema:
            type: string
        - name: entidad
          required: true
          in: query
          description: Tabla, vista o colección
          schema:
            maxLength: 150
            example: clientes
            type: string
        - name: esquema
          required: false
          in: query
          description: 'Esquema SQL (si se omite: public / el de la conexión)'
          schema:
            example: public
            type: string
        - name: limite
          required: false
          in: query
          description: Filas por página
          schema:
            minimum: 1
            maximum: 1000
            default: 50
            type: number
        - name: cursor
          required: false
          in: query
          description: Cursor opaco devuelto en `nextCursor` de la página anterior. Sin cursor se lee la primera página.
          schema:
            maxLength: 2048
            type: string
        - name: filtros
          required: false
          in: query
          description: >-
            Filtros en JSON con el mismo formato que en el cross-join (condiciones y grupos AND/OR), por ejemplo
            [{"campo":"pais","operador":"eq","valor":"NI"}]. Se aplican antes de paginar.
          schema:
            maxLength: 4000
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowseDataResponseDto'
        '400':
          description: Parámetros, filtros o cursor no válidos; motor sin paginación o tabla sin llave primaria.
        '401':
          description: Token JWT inválido o ausente.
        '403':
          description: Se requiere rol ADMIN u OPERADOR para explorar datos.
        '404':
          description: Conexión fuera del workspace o inexistente.
        '413':
          description: La página supera el máximo de bytes configurado.
        '502':
          description: Falló la consulta en la fuente externa.
        '504':
          description: La lectura de la página superó el límite de 10 segundos.
      security:
        - bearer: []
      summary: Explorar los datos de una tabla o colección con paginación por cursor
      tags:
        - Engine - Cross-Join & Analytics
