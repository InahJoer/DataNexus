        serverVersion:
          type: string
          nullable: true
          example: PostgreSQL 16.2
        error:
          nullable: true
          description: Error normalizado por motor; nunca incluye el mensaje original del driver.
          type: object
          allOf:
            - $ref: '#/components/schemas/ConnectionTestErrorDto'
      required:
        - ok
        - latencyMs
        - serverVersion
        - error
    ConnectionTestOptionsDto:
