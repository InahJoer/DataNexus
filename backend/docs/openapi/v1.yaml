    PostgresCredentialsDto:
      type: object
      properties:
        host:
          type: string
          example: db.empresa.internal
          description: Servidor (nombre o IP), sin protocolo
        port:
          type: number
          description: Puerto; si se omite se usa el del motor
          example: 5432
        database:
          type: string
          example: analytics
          description: Base de datos
        username:
          type: string
          example: lector_bi
        password:
          type: string
          example: S3creta#2026
          description: Se cifra con AES-256 y nunca se devuelve
        ssl:
          type: boolean
          default: false
          description: Exigir TLS (sslmode=require)
      required:
        - host
        - database
        - username
        - password
    MysqlCredentialsDto:
      type: object
      properties:
        host:
          type: string
          example: db.empresa.internal
          description: Servidor (nombre o IP), sin protocolo
        port:
          type: number
          description: Puerto; si se omite se usa el del motor
          example: 5432
        database:
          type: string
          example: analytics
          description: Base de datos
        username:
          type: string
          example: lector_bi
        password:
          type: string
          example: S3creta#2026
          description: Se cifra con AES-256 y nunca se devuelve
        ssl:
          type: boolean
          default: false
          description: Conectar con TLS
      required:
        - host
        - database
        - username
        - password
    SqlServerCredentialsDto:
      type: object
      properties:
        host:
          type: string
          example: db.empresa.internal
          description: Servidor (nombre o IP), sin protocolo
        port:
          type: number
          description: Puerto; si se omite se usa el del motor
          example: 5432
        database:
          type: string
          example: analytics
          description: Base de datos
        username:
          type: string
          example: lector_bi
        password:
          type: string
          example: S3creta#2026
          description: Se cifra con AES-256 y nunca se devuelve
        encrypt:
          type: boolean
          default: true
          description: Cifrar la conexión (Encrypt)
        trustServerCertificate:
          type: boolean
          default: false
          description: Aceptar certificados no verificados (solo desarrollo)
      required:
        - host
        - database
        - username
        - password
    MongoCredentialsDto:
      type: object
      properties:
        uri:
          type: string
          example: mongodb+srv://lector:S3creta@cluster0.mongodb.net/?retryWrites=true
          description: URI de conexión mongodb:// o mongodb+srv://. Se cifra y nunca se devuelve.
        database:
          type: string
          example: ventas
      required:
        - uri
        - database
    FirestoreCredentialsDto:
      type: object
      properties:
        serviceAccount:
          type: object
          additionalProperties: true
          description: >-
            Contenido del JSON de Service Account de Firebase (type, project_id, private_key, client_email...). También
            puede subirse como archivo en POST /connections/firestore.
        databaseId:
          type: string
          default: (default)
          example: (default)
          description: Base de datos de Firestore
      required:
        - serviceAccount
    CreateConnectionDto:
      type: object
      properties:
        nombre:
          type: string
          example: Ventas producción
          description: Nombre descriptivo de la conexión
        tipoMotor:
          type: string
          enum:
            - POSTGRESQL
            - MYSQL
            - SQLSERVER
            - FIRESTORE
            - MONGODB
          example: POSTGRESQL
          description: >-
            Tipo de motor; define el formato de `credenciales`. Se aceptan alias como "SQL Server", "Firebase" o
            "postgres".
        credenciales:
          oneOf:
            - $ref: '#/components/schemas/PostgresCredentialsDto'
            - $ref: '#/components/schemas/MysqlCredentialsDto'
            - $ref: '#/components/schemas/SqlServerCredentialsDto'
            - $ref: '#/components/schemas/MongoCredentialsDto'
            - $ref: '#/components/schemas/FirestoreCredentialsDto'
          description: >-
            Credenciales según el motor: POSTGRESQL/MYSQL (host, port, database, username, password, ssl), SQLSERVER
            (host, port, database, username, password, encrypt, trustServerCertificate), MONGODB (uri, database) o
            FIRESTORE (serviceAccount, databaseId). Se cifran con AES-256 y nunca se devuelven.
      required:
        - tipoMotor
        - credenciales
    ConnectionResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          nullable: true
          example: Ventas producción
        tipoMotor:
          type: string
          enum:
            - POSTGRESQL
            - MYSQL
            - SQLSERVER
            - FIRESTORE
            - MONGODB
          example: POSTGRESQL
        host:
          type: string
          example: db.internal
        dbName:
          type: string
          example: analytics
        workspaceId:
          type: string
          format: uuid
        formatoCredenciales:
          type: string
          enum:
            - ESTRUCTURADO
            - LEGADO
          description: LEGADO = cadena de conexión libre anterior a RF-08; conviene volver a guardar sus credenciales.
        detalles:
          type: object
          nullable: true
          additionalProperties: true
          example:
            puerto: 5432
            usuario: lector_bi
            ssl: true
          description: >-
            Metadatos no secretos (puerto, usuario, ssl, projectId, clientEmail...). Nunca incluye contraseñas ni
            claves.
      required:
        - id
        - nombre
        - tipoMotor
        - host
        - dbName
        - workspaceId
        - formatoCredenciales
        - detalles
    TestConnectionDto:
      type: object
      properties:
        timeoutMs:
          type: number
          minimum: 1000
          maximum: 30000
          example: 5000
          description: Tiempo máximo de la prueba en milisegundos. Por defecto CONNECTION_TEST_TIMEOUT_MS (10000).
        tipoMotor:
          type: string
          enum:
            - POSTGRESQL
            - MYSQL
            - SQLSERVER
            - FIRESTORE
            - MONGODB
          example: POSTGRESQL
          description: Tipo de motor; define el formato de `credenciales`. Acepta los mismos alias que el alta.
