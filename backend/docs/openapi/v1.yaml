          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  actualizada:
                    type: boolean
                    example: true
                  entidad:
                    type: string
                    example: clientes
                  campo:
                    type: string
                    example: nombre
                  valorAnterior:
                    nullable: true
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
                  valorNuevo:
                    nullable: true
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
        '400':
