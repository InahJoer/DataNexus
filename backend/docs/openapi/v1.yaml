        ADMIN.
      operationId: WorkspacesController_findMine
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseDto'
        '401':
          description: Token JWT inválido o ausente.
        '404':
          description: El workspace del token ya no existe.
      security:
        - bearer: []
      summary: Obtener el workspace del usuario autenticado
      tags:
        - Workspaces
    patch:
      description: >-
        Cambia nombre, logo, zona horaria, dominios permitidos y campos sensibles por defecto. Registra
        WORKSPACE_UPDATED con el antes y el después.
      operationId: WorkspacesController_updateMine
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseDto'
        '400':
          description: Datos inválidos o ningún campo a modificar.
        '401':
          description: Token JWT inválido o ausente.
        '403':
          description: Se requiere rol ADMIN.
      security:
        - bearer: []
      summary: Actualizar el workspace (ADMIN)
      tags:
        - Workspaces
  /workspaces/me/stats:
    get:
      description: Número de miembros por rol, conexiones por motor y reportes enviados. Disponible para cualquier rol.
      operationId: WorkspacesController_getStats
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStatsDto'
        '401':
          description: Token JWT inválido o ausente.
      security:
        - bearer: []
      summary: Estadísticas del workspace
      tags:
        - Workspaces
  /dashboard/summary:
    get:
      description: >-
        Conexiones activas/caídas y latencia del último health check, Cross-Joins y exportaciones del mes con su
        variación, datos procesados frente al límite del plan, consumo de API de 7 días, consultas guardadas recientes,
        reportes próximos, actividad reciente de la bitácora y estado del entorno. Cualquier rol autenticado; las
        secciones que el rol no puede ver llegan como null. Se cachea 60 s por workspace y rol.
      operationId: DashboardController_getSummary
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryDto'
        '401':
          description: Token JWT inválido o ausente.
      security:
        - bearer: []
      summary: 'Resumen del workspace para la Vista general (issue #40)'
      tags:
        - Dashboard
  /health:
    get:
      description: >-
        No consulta dependencias. Úsala como health check del contenedor para no reiniciarlo por una caída de la base de
        datos.
      operationId: HealthController_live
      parameters: []
      responses:
        '200':
          description: La API está viva
      summary: 'Liveness: el proceso responde'
      tags:
        - Health
  /health/ready:
    get:
      description: >-
        Responde 503 si PostgreSQL o Redis (cuando REDIS_URL está configurado) no responden. Un fallo de SMTP deja el
        estado en `degraded` con HTTP 200: la API sigue sirviendo, pero los correos fallarán.
      operationId: HealthController_ready
      parameters: []
      responses:
        '200':
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                    example: ok
                  info:
                    type: object
                    example:
                      database:
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database:
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
        '503':
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                      - shutting_down
                    example: error
                  info:
                    type: object
                    example:
                      database:
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis:
                        status: down
                        message: Could not connect
                        responseTime: 3005
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database:
                        status: up
                        responseTime: 12
                      redis:
                        status: down
                        message: Could not connect
                        responseTime: 3005
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
      summary: 'Readiness: PostgreSQL, Redis y SMTP'
      tags:
        - Health
info:
  title: DataNexus API
  description: >-
    Plataforma Unificada de Gestión de Datos Mixtas y Business Intelligence. Autenticación: `Authorization: Bearer
    <access_token>` de una sesión, o `Bearer pat_...` (token de acceso personal) en los endpoints de integración. Todos
    los datos están aislados por workspace.
  version: 1.3.0
  contact: {}
tags:
  - name: Auth
    description: Autenticación, sesiones, perfil y tokens de acceso personal
  - name: Connections
    description: Gestión y administración de conexiones DB encriptadas con AES-256
  - name: Users
    description: Gestión de usuarios y roles dentro del workspace
  - name: Workspaces
    description: 'Gestión del espacio de trabajo: datos, configuración y estadísticas'
  - name: Engine - Cross-Join & Analytics
    description: Motor de Cross-Joins en memoria, enmascaramiento y exportación
  - name: Audit
    description: Bitácora y consulta de logs de auditoría con paginación y filtros
  - name: Reports - Automation
    description: Automatización de reportes periódicos y despacho por correo electrónico
  - name: Health
    description: Sondas de disponibilidad para el monitoreo (liveness y readiness)
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RefreshTokenDto:
      type: object
      properties:
        refresh_token:
          type: string
          description: Refresh token recibido en el login o en la última renovación
      required:
        - refresh_token
    AuthUserResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - OPERADOR
            - LECTOR
            - AUDITOR
        workspaceId:
          type: string
          format: uuid
      required:
        - id
        - email
        - name
        - role
        - workspaceId
    AuthResponseDto:
      type: object
      properties:
        access_token:
          type: string
          description: 'JWT de acceso para Authorization: Bearer (vence en expires_in segundos)'
        refresh_token:
          type: string
          description: 'Refresh token rotativo para POST /auth/refresh. Es de un solo uso: cada renovación devuelve uno nuevo.'
        expires_in:
          type: number
          example: 900
          description: Segundos de vida del access token
        user:
          $ref: '#/components/schemas/AuthUserResponseDto'
      required:
        - access_token
        - refresh_token
        - expires_in
        - user
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          example: admin@datanexus.demo
      required:
        - email
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: Token recibido en el enlace del correo
        newPassword:
          type: string
          example: NuevaClave#2026
          description: >-
            Entre 10 y 72 caracteres, con al menos una mayúscula, una minúscula, un número y un símbolo. No puede
            contener tu correo ni contraseñas comunes.
      required:
        - token
        - newPassword
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: admin@datanexus.com
          description: Correo electrónico registrado del usuario
        password:
          type: string
          example: SecurePassword123!
          description: Contraseña del usuario
      required:
        - email
        - password
    SignupDto:
      type: object
      properties:
        tipoCuenta:
          type: string
          enum:
            - PERSONAL
            - ORGANIZACION
          example: ORGANIZACION
        name:
          type: string
          example: Ana Martínez
        email:
          type: string
          example: ana@acme.com
          description: En organizaciones debe ser un correo corporativo
        password:
          type: string
          example: Segura#2026dn
          description: >-
            Entre 10 y 72 caracteres, con al menos una mayúscula, una minúscula, un número y un símbolo. No puede
            contener tu correo ni contraseñas comunes.
        nombreEmpresa:
          type: string
          example: Acme Analytics S.A.
          description: Obligatorio en organizaciones
        zonaHoraria:
          type: string
          example: America/Managua
          description: Zona horaria IANA del navegador
      required:
        - tipoCuenta
        - name
        - email
        - password
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: admin@empresa.com
          description: Correo corporativo del usuario (no se aceptan Gmail, Hotmail, Outlook, etc.)
        name:
          type: string
          example: Admin User
          description: Nombre completo del usuario
        password:
          type: string
          example: Segura#2026dn
          description: >-
