          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQueryResponseDto'
        '401':
          description: Token JWT inválido o ausente.
        '403':
          description: Se requiere rol ADMIN u OPERADOR.
        '404':
          description: Alguna conexión no existe en el workspace.
        '409':
          description: Ya existe una consulta con ese nombre.
      security:
        - bearer: []
      summary: Guardar una consulta (vista unificada) del Query Builder
      tags:
        - Consultas guardadas
    get:
      description: ADMIN y OPERADOR ven todas; el LECTOR solo las publicadas y sin su definición.
      operationId: SavedQueriesController_findAll
      parameters:
        - name: visibilidad
          required: false
          in: query
          schema:
            type: string
            enum:
              - PRIVADA
              - PUBLICADA
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedQueryResponseDto'
        '401':
          description: Token JWT inválido o ausente.
        '403':
          description: El AUDITOR no accede a datos de negocio.
      security:
        - bearer: []
      summary: Listar consultas guardadas del workspace
      tags:
        - Consultas guardadas
  /queries/{id}:
    get:
      operationId: SavedQueriesController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQueryResponseDto'
        '401':
          description: Token JWT inválido o ausente.
        '404':
          description: No existe o no es visible para el rol.
      security:
        - bearer: []
      summary: Obtener una consulta guardada
      tags:
        - Consultas guardadas
    patch:
      description: Solo el autor o un ADMIN. Si cambia la definición se crea una versión nueva.
      operationId: SavedQueriesController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSavedQueryDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQueryResponseDto'
        '401':
          description: Token JWT inválido o ausente.
        '403':
          description: Solo el autor o un ADMIN puede modificarla.
        '404':
          description: Consulta o conexión no encontrada.
        '409':
          description: Ya existe una consulta con ese nombre.
      security:
        - bearer: []
      summary: Actualizar una consulta guardada
      tags:
        - Consultas guardadas
    delete:
      operationId: SavedQueriesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '401':
          description: Token JWT inválido o ausente.
        '403':
          description: Solo el autor o un ADMIN puede eliminarla.
        '404':
          description: Consulta no encontrada.
      security:
        - bearer: []
      summary: Eliminar una consulta guardada y su historial de versiones
      tags:
        - Consultas guardadas
  /queries/{id}/versions:
    get:
      operationId: SavedQueriesController_listVersions
      parameters:
        - name: id
