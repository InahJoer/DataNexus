          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExcelFileResponseDto'
      security:
        - bearer: []
      summary: Listar los archivos de Excel del workspace con sus hojas
      tags:
        - Archivos de Excel
    post:
      description: >-
        Cada hoja con datos se convierte en una tabla: la fila 1 son los encabezados y la columna 1 el identificador de
        cada registro. La respuesta llega en cuanto el archivo se recibe (estado PROCESANDO); la lectura sigue en
        segundo plano por streaming, sin límite de registros, y el archivo pasa a LISTO al terminar (consulta GET
        /excel/{id}). El id devuelto funciona como conexionId en el explorador, el editor de consultas y las
        exportaciones.
      operationId: ExcelSourcesController_upload
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - archivo
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Libro .xlsx o archivo .csv. Sin límite de tamaño salvo EXCEL_MAX_UPLOAD_MB.
                nombre:
                  type: string
                  maxLength: 120
      responses:
        '202':
          description: 'Archivo recibido: se está procesando en segundo plano.'
