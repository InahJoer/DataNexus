openapi: 3.0.3
info:
  title: DataNexus API
  version: 1.2.0
  description: >-
    Contrato HTTP versionado del backend DataNexus para consumo desde los demás
    repositorios del Polyrepo. Autorización por JWT y aislamiento por workspace.
servers:
  - url: /
    description: Host configurado para el backend
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT y perfil público.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar usuario como LECTOR
      description: >-
        Ruta pública. El rol lo asigna el servidor como LECTOR; role no forma
        parte del cuerpo aceptado. La admisión al workspace continúa pendiente
        de política de producto.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado sin contraseña.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El correo ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/profile:
    get:
      tags: [Auth]
      summary: Consultar el perfil autenticado
      responses:
        '200':
          description: Perfil público y workspace del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /connections:
    get:
      tags: [Connections]
      summary: Listar conexiones del workspace autenticado
      responses:
        '200':
          description: Conexiones sin credenciales.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Connections]
      summary: Crear una conexión para el workspace autenticado
      description: Solo ADMIN. connectionString se acepta al crear, pero nunca se devuelve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionRequest'
      responses:
        '201':
          description: Conexión creada sin credenciales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /connections/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    get:
      tags: [Connections]
      summary: Obtener una conexión del workspace autenticado
      responses:
        '200':
          description: Conexión sin credenciales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Connections]
      summary: Actualizar una conexión del workspace autenticado
      description: Solo ADMIN. workspaceId no se puede cambiar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionRequest'
      responses:
        '200':
          description: Conexión actualizada sin credenciales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Connections]
      summary: Eliminar una conexión del workspace autenticado
      description: Solo ADMIN.
      responses:
        '200':
          description: Conexión eliminada sin credenciales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/invite:
    post:
      tags: [Users]
      summary: Invitar a un nuevo miembro por enlace
      description: >-
        Solo ADMIN. Crea una invitación de un solo uso y envía el enlace por correo. Respeta los dominios
        permitidos del workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserRequest'
      responses:
        '201':
          description: Invitación creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/invitations:
    get:
      tags: [Users]
      summary: Listar invitaciones del workspace
      description: Solo ADMIN.
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [PENDIENTE, ACEPTADA, REVOCADA, EXPIRADA]
      responses:
        '200':
          description: Invitaciones, de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/invitations/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    post:
      tags: [Users]
      summary: Reenviar una invitación pendiente o expirada
      description: Solo ADMIN. Genera un enlace nuevo y renueva el vencimiento.
      responses:
        '200':
          description: Invitación reenviada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    delete:
      tags: [Users]
      summary: Revocar una invitación pendiente
      description: Solo ADMIN.
      responses:
        '200':
          description: Invitación revocada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    delete:
      tags: [Users]
      summary: Dar de baja a un miembro del workspace
      description: >-
        Solo ADMIN. Elimina la cuenta y sus sesiones. No se permite la baja propia ni dejar el workspace sin ADMIN.
      responses:
        '200':
          description: Miembro dado de baja sin contraseña.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/invitation-preview:
    post:
      tags: [Auth]
      summary: Consultar una invitación antes de aceptarla
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
      responses:
        '200':
          description: Datos públicos de la invitación vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/accept-invite:
    post:
      tags: [Auth]
      summary: Aceptar una invitación y definir la contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Cuenta activada.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/UuidPath'
    patch:
      tags: [Users]
      summary: Cambiar rol de otro usuario del workspace
      description: Solo ADMIN. El cambio y el evento de auditoría son atómicos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Usuario actualizado sin contraseña.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/me:
    get:
      tags: [Workspaces]
      summary: Obtener el workspace del usuario autenticado
      description: >-
        Cualquier rol. El workspace se toma del JWT. La configuración solo se incluye para ADMIN.
      responses:
        '200':
          description: Workspace propio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Workspaces]
      summary: Actualizar el workspace
      description: >-
        Solo ADMIN. Cambio parcial; registra WORKSPACE_UPDATED con antes/después en la misma transacción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace actualizado con su configuración.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/me/stats:
    get:
      tags: [Workspaces]
      summary: Estadísticas del workspace
      description: Cualquier rol. Miembros por rol, conexiones por motor y reportes enviados.
      responses:
        '200':
          description: Estadísticas del workspace propio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /data-engine/join:
    post:
      tags: [Data Engine]
      summary: Ejecutar un join real entre SQL Server y Firestore
      description: >-
        Lee hasta DATA_ENGINE_MAX_SOURCE_ROWS filas y DATA_ENGINE_MAX_SOURCE_BYTES
        serializados por origen. El join limita las filas y los bytes resultantes
        con DATA_ENGINE_MAX_JOIN_ROWS y DATA_ENGINE_MAX_JOIN_BYTES. Las columnas
        duplicadas reciben prefijos sql. y nosql. Los motores sin extractor real
        se rechazan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossJoinRequest'
      responses:
        '200':
          description: Resultado combinado y enmascarado según el rol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossJoinResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          description: Falló una conexión o consulta externa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: Una consulta externa excedió su timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /data-engine/export:
    post:
      tags: [Data Engine]
      summary: Exportar el resultado real del join
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossJoinExportRequest'
      responses:
        '200':
          description: Archivo generado en el formato solicitado.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '502':
          description: Falló una conexión o consulta externa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: Una consulta externa excedió su timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /data-engine/connections/{connectionId}/schema:
    parameters:
      - name: connectionId
        in: path
        required: true
        description: UUID v4 de una conexión perteneciente al workspace autenticado.
        schema:
          type: string
          format: uuid
    get:
      tags: [Data Engine]
      summary: Explorar tablas, vistas o colecciones externas
      description: >-
        Motores para explorar el catálogo: SQLServer, PostgreSQL, MySQL y Firebase/Cloud Firestore.
        Firestore lista colecciones de nivel raíz. Solo devuelve catálogo; no lee
        filas ni documentos. Tiempo máximo de 10 segundos.
      responses:
        '200':
          description: Catálogo de objetos externos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaExplorationResult'
        '400':
          description: Motor no soportado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Falló la conexión o consulta del catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: La exploración excedió 10 segundos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UuidPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          writeOnly: true
    RegisterRequest:
      type: object
      required: [email, name, password, workspaceId]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 6
          writeOnly: true
        workspaceId:
          type: string
          description: ID del workspace existente.
    AuthResult:
      type: object
      required: [access_token, user]
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/PublicUser'
    PublicUser:
      type: object
      required: [id, email, name, role, workspaceId]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [ADMIN, OPERADOR, LECTOR, AUDITOR]
        workspaceId:
          type: string
          description: ID del workspace.
    RegisteredUser:
      type: object
      required: [id, email, name, role, workspaceId]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [LECTOR]
        workspaceId:
          type: string
          description: ID del workspace.
    Connection:
      type: object
      required: [id, tipoMotor, host, dbName, workspaceId]
      properties:
        id:
          type: string
          format: uuid
        tipoMotor:
          type: string
          example: PostgreSQL
        host:
          type: string
          example: db.example.internal
        dbName:
          type: string
          example: analytics
        workspaceId:
          type: string
          format: uuid
    CreateConnectionRequest:
      type: object
      required: [tipoMotor, host, dbName, connectionString]
      properties:
        tipoMotor:
          type: string
          description: Motor; la exploración soporta SQLServer, PostgreSQL, MySQL y Firebase/Firestore.
        host:
          type: string
        dbName:
          type: string
        connectionString:
          type: string
          writeOnly: true
          description: >-
            Credenciales para el motor. Firestore espera JSON de cuenta de servicio
            con project_id, client_email y private_key. No se devuelve ni se audita.
    UpdateConnectionRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        tipoMotor:
          type: string
          description: Motor; la exploración soporta SQLServer, PostgreSQL, MySQL y Firebase/Firestore.
        host:
          type: string
        dbName:
          type: string
        connectionString:
          type: string
          writeOnly: true
          description: Nueva credencial; nunca se devuelve ni se audita.
    InviteUserRequest:
      type: object
      additionalProperties: false
      required: [email, name, role]
      properties:
        email:
          type: string
          format: email
          description: Correo corporativo.
        name:
          type: string
          maxLength: 120
        role:
          type: string
          enum: [ADMIN, OPERADOR, LECTOR, AUDITOR]
    Invitation:
      type: object
      required: [id, email, name, role, estado, expiresAt, createdAt, acceptedAt, revokedAt, invitedBy]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [ADMIN, OPERADOR, LECTOR, AUDITOR]
        estado:
          type: string
          enum: [PENDIENTE, ACEPTADA, REVOCADA, EXPIRADA]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        invitedBy:
          type: object
          nullable: true
          required: [id, name, email]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
        correoEnviado:
          type: boolean
          description: Solo al invitar o reenviar.
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{20,128}$'
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{20,128}$'
        password:
          type: string
          minLength: 10
          maxLength: 72
          description: Debe cumplir la política de contraseñas.
        name:
          type: string
          maxLength: 120
    InvitationPreview:
      type: object
      required: [email, name, role, nombreEmpresa, expiresAt]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [ADMIN, OPERADOR, LECTOR, AUDITOR]
        nombreEmpresa:
          type: string
        expiresAt:
          type: string
          format: date-time
    UpdateUserRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [ADMIN, OPERADOR, LECTOR, AUDITOR]
    UserRoleResult:
      type: object
      required: [id, email, name, role, workspaceId]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [ADMIN, OPERADOR, LECTOR, AUDITOR]
        workspaceId:
          type: string
          format: uuid
    Workspace:
      type: object
      required: [id, nombreEmpresa, logoUrl, zonaHoraria, fechaCreacion, fechaActualizacion]
      properties:
        id:
          type: string
          format: uuid
        nombreEmpresa:
          type: string
        logoUrl:
          type: string
          format: uri
          nullable: true
        zonaHoraria:
          type: string
          example: America/Managua
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time
        configuracion:
          description: Solo para ADMIN.
          type: object
          required: [dominiosPermitidos, camposSensibles]
          properties:
            dominiosPermitidos:
              type: array
              items:
                type: string
            camposSensibles:
              type: array
              items:
                type: string
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombreEmpresa:
          type: string
          minLength: 2
          maxLength: 120
        logoUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          nullable: true
          description: null elimina el logo.
        zonaHoraria:
          type: string
          description: Identificador IANA.
          example: America/Managua
        dominiosPermitidos:
          type: array
          maxItems: 50
          description: Lista vacía = sin restricción. No admite proveedores de correo personal.
          items:
            type: string
            example: empresa.com
        camposSensibles:
          type: array
          maxItems: 200
          items:
            type: string
            example: cliente.email
    WorkspaceStats:
      type: object
      required: [miembros, conexiones, reportes]
      properties:
        miembros:
          type: object
          required: [total, porRol]
          properties:
            total:
              type: integer
            porRol:
              type: object
              additionalProperties:
                type: integer
        conexiones:
          type: object
          required: [total, porMotor]
          properties:
            total:
              type: integer
            porMotor:
              type: object
              additionalProperties:
                type: integer
        reportes:
          type: object
          required: [enviados, ultimoEnvio]
          properties:
            enviados:
              type: integer
            ultimoEnvio:
              type: string
              format: date-time
              nullable: true
    SchemaExplorationResult:
      type: object
      required: [connectionId, tipoMotor, objects]
      properties:
        connectionId:
          type: string
          format: uuid
        tipoMotor:
          type: string
          example: PostgreSQL
        objects:
          type: array
          items:
            $ref: '#/components/schemas/CatalogObject'
    CatalogObject:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [TABLE, VIEW, COLLECTION]
        schema:
          type: string
    CrossJoinRequest:
      type: object
      required:
        - conexionSqlId
        - conexionNoSqlId
        - tablaSql
        - coleccionNoSql
        - llaveSql
        - llaveNoSql
      properties:
        conexionSqlId:
          type: string
          format: uuid
        conexionNoSqlId:
          type: string
          format: uuid
        tablaSql:
          type: string
          maxLength: 128
        esquemaSql:
          type: string
          maxLength: 128
        coleccionNoSql:
          type: string
          maxLength: 150
        llaveSql:
          type: string
          maxLength: 128
        llaveNoSql:
          type: string
          maxLength: 150
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 50
        offset:
          type: integer
          minimum: 0
          default: 0
    CrossJoinExportRequest:
      allOf:
        - $ref: '#/components/schemas/CrossJoinRequest'
        - type: object
          required: [format]
          properties:
            format:
              type: string
              enum: [excel, pdf, json]
    CrossJoinResult:
      type: object
      required: [total, limit, offset, data]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    ApiError:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Token JWT inválido o ausente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: El actor no tiene permisos para esta operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso no encontrado en el workspace autenticado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: El origen o resultado supera los límites de filas configurados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
