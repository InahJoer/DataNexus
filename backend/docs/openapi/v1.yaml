            - created_at
          type: array
          items:
            type: string
      required:
        - connectionId
        - objectName
        - fields
    BrowseDataResponseDto:
      type: object
      properties:
        entidad:
          type: string
          example: clientes
        esquema:
          type: string
          example: public
        limite:
          type: number
          example: 50
        orden:
          example:
            - id
          description: Columnas por las que avanza el cursor (llave primaria, _id o id del documento)
          type: array
          items:
            type: string
        filas:
          type: number
          example: 50
          description: Filas de esta página
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        nextCursor:
          type: string
          nullable: true
          description: Cursor para pedir la página siguiente; null si es la última
          example: eyJ2IjoxLCJiIjoi...
      required:
        - entidad
        - limite
        - orden
        - filas
        - data
        - nextCursor
    UpdateRecordDto:
      type: object
      properties:
        conexionId:
          type: string
          format: uuid
          example: 61d0a4cf-8b3c-4f27-8540-1c038b38c124
        entidad:
          type: string
          maxLength: 150
          example: clientes
        esquema:
          type: string
          maxLength: 128
          example: public
        llavePrimaria:
          oneOf:
            - type: string
              example: documento-123
            - type: object
              additionalProperties: true
              example:
                id: 42
          description: ID del documento en Firestore o mapa exacto de columnas de llave primaria SQL.
        campo:
          type: string
          maxLength: 128
          example: nombre
        valorAnterior:
          nullable: true
          oneOf:
            - type: string
            - type: number
            - type: boolean
        valorNuevo:
          nullable: true
          oneOf:
            - type: string
            - type: number
            - type: boolean
      required:
        - conexionId
        - entidad
        - llavePrimaria
        - campo
        - valorAnterior
        - valorNuevo
    DataFilterDto:
      type: object
      properties:
        campo:
          type: string
          description: Campo de origen que se filtrará
          example: status
          maxLength: 150
        operador:
          type: string
          enum:
            - eq
            - neq
            - gt
            - gte
            - lt
            - lte
            - in
            - not-in
            - between
            - contains
            - startsWith
            - isNull
          example: eq
        valor:
          type: object
          description: >-
            eq/neq: escalar o null · gt/gte/lt/lte: escalar · in/not-in: lista de 1 a 10 escalares · between: [mínimo,
            máximo] (números o textos, p. ej. fechas ISO) · contains/startsWith: texto (sin distinguir mayúsculas) ·
            isNull: true (es nulo) o false (no es nulo)
          example: active
      required:
        - campo
        - operador
        - valor
    FilterGroupDto:
      type: object
      properties:
        logica:
          type: string
          enum:
            - AND
            - OR
          example: OR
        filtros:
          type: array
          description: Condiciones o grupos del grupo
          items:
            oneOf:
              - $ref: '#/components/schemas/DataFilterDto'
              - $ref: '#/components/schemas/FilterGroupDto'
      required:
        - logica
        - filtros
    JoinSourceDto:
      type: object
      properties:
        alias:
          type: string
          description: Alias único de la fuente; se usa en las relaciones y para calificar columnas repetidas
          example: clientes
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,31}$
        conexionId:
          type: string
          description: UUID de la conexión
          example: a1b2c3d4-e5f6-4a8b-9c0d-1e2f3a4b5c6d
        entidad:
          type: string
          description: Tabla, vista o colección de la conexión
          example: clientes
        esquema:
          type: string
          description: Esquema SQL de la tabla
          example: public
          maxLength: 128
        filtros:
          type: array
          description: >-
            Filtros aplicados en el origen (filter pushdown cuando el motor lo admite). Se combinan con AND; usa grupos
            { logica: 'OR', filtros: [...] } para OR. Máximo 20 condiciones.
          items:
            oneOf:
              - $ref: '#/components/schemas/DataFilterDto'
              - $ref: '#/components/schemas/FilterGroupDto'
      required:
        - alias
        - conexionId
        - entidad
    JoinKeyPairDto:
      type: object
      properties:
        izquierda:
          type: string
          description: Campo de la fuente izquierda
          example: cliente_id
        derecha:
          type: string
          description: Campo de la fuente derecha
          example: cliente_ref
      required:
        - izquierda
        - derecha
    JoinRelationDto:
      type: object
      properties:
        izquierda:
          type: string
          description: Alias de una fuente ya unida
          example: clientes
        derecha:
          type: string
          description: Alias de la fuente que se añade
          example: pedidos
        tipo:
          type: string
          enum:
            - INNER
            - LEFT
            - RIGHT
            - FULL
          default: INNER
        llaves:
          description: De 1 a 3 pares de llaves (llave compuesta)
          type: array
          items:
            $ref: '#/components/schemas/JoinKeyPairDto'
      required:
        - izquierda
        - derecha
        - llaves
    AggregationMetricDto:
      type: object
      properties:
        operation:
          type: string
          enum:
            - COUNT
            - COUNT_DISTINCT
            - SUM
            - AVG
            - MIN
            - MAX
          example: SUM
        field:
          type: string
          description: Campo unificado sobre el que opera la métrica
        as:
          type: string
          description: Nombre del campo de salida
          example: total
      required:
        - operation
        - as
    SortSpecDto:
      type: object
      properties:
        campo:
          type: string
          example: total
        direccion:
          type: string
          enum:
            - ASC
            - DESC
          example: DESC
      required:
        - campo
        - direccion
    CrossJoinDto:
      type: object
      properties:
        fuentes:
          description: 'Formato de N fuentes: de 2 a 5 tablas o colecciones'
          type: array
          items:
            $ref: '#/components/schemas/JoinSourceDto'
        relaciones:
          description: >-
            Formato de N fuentes: una relación por cada fuente que se añade. La primera une dos fuentes y cada una de
            las siguientes une una fuente nueva (derecha) a una ya unida (izquierda).
          type: array
          items:
            $ref: '#/components/schemas/JoinRelationDto'
        tipoJoin:
          type: string
          description: 'Formato original: tipo de join entre la tabla SQL y la colección NoSQL'
          enum:
            - INNER
            - LEFT
            - RIGHT
            - FULL
          default: INNER
        conexionSqlId:
          type: string
          description: 'Formato original: UUID de la conexión SQL origen'
          example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        conexionNoSqlId:
          type: string
          description: 'Formato original: UUID de la conexión NoSQL origen'
          example: b2c3d4e5-f6a7-8b9c-0d1e-2f3a4b5c6d7e
        tablaSql:
          type: string
          description: 'Formato original: nombre de la tabla SQL a consultar'
          example: clientes
        esquemaSql:
          type: string
          description: Esquema SQL de la tabla cuando se conoce o hay nombres duplicados
          example: dbo
          maxLength: 128
        coleccionNoSql:
          type: string
          description: 'Formato original: nombre de la colección NoSQL a consultar'
          example: pedidos
        llaveSql:
          type: string
          description: 'Formato original: nombre de la llave en la tabla SQL para el Join'
          example: id
        llaveNoSql:
          type: string
          description: 'Formato original: nombre de la llave en la colección NoSQL para el Join'
          example: cliente_id
        filtrosSql:
          type: array
          description: >-
            Formato original: filtros de la tabla SQL. Se combinan con AND; usa grupos { logica: 'OR', filtros: [...] }
            para OR. Máximo 20 condiciones.
          items:
            oneOf:
              - $ref: '#/components/schemas/DataFilterDto'
              - $ref: '#/components/schemas/FilterGroupDto'
        filtrosNoSql:
          type: array
          description: >-
            Formato original: filtros de la colección NoSQL. Se combinan con AND; usa grupos { logica: 'OR', filtros:
            [...] } para OR. Máximo 20 condiciones.
          items:
            oneOf:
              - $ref: '#/components/schemas/DataFilterDto'
              - $ref: '#/components/schemas/FilterGroupDto'
        groupBy:
          description: Campos unificados usados para agrupar filas después del cross-join
          example:
            - nosql.status
          type: array
          items:
            type: string
        aggregations:
          description: Métricas calculadas después del cross-join
          type: array
          items:
            $ref: '#/components/schemas/AggregationMetricDto'
        columnas:
          description: >-
            Columnas de salida en orden (editor de consultas). Se aplican después del enmascaramiento; las que no
            existen salen en null. Sin lista, se devuelven todas. También las usan la exportación y los reportes
            programados.
          example:
            - clientes.nombre
            - total
          type: array
          items:
            type: string
        aliasColumnas:
          type: object
          description: 'Renombra columnas de salida (alias), por ejemplo { "clientes.nombre": "Cliente" }'
          additionalProperties:
            type: string
          example:
            clientes.nombre: Cliente
        ordenarPor:
          description: Orden del resultado (ORDER BY) por una o más columnas, antes de paginar
          type: array
          items:
            $ref: '#/components/schemas/SortSpecDto'
        filtrosResultado:
          type: array
          description: >-
            Filtros sobre la tabla combinada (como en el explorador): se aplican al final, sobre las columnas de salida
            con su nombre o alias. Con agrupación funcionan como HAVING. Se combinan con AND; usa grupos { logica: 'OR',
            filtros: [...] } para OR. Máximo 20 condiciones.
          items:
            oneOf:
              - $ref: '#/components/schemas/DataFilterDto'
              - $ref: '#/components/schemas/FilterGroupDto'
        lienzo:
          type: object
          description: Disposición visual del Query Builder (posiciones de las tarjetas). El motor la ignora.
          additionalProperties: true
        limit:
          type: number
          description: Límite de elementos por página
          default: 50
          minimum: 1
          maximum: 1000
        offset:
          type: number
          description: Desplazamiento (offset) para la paginación
          default: 0
          minimum: 0
        limiteFilas:
          type: number
          description: >-
            Máximo de filas del resultado (RF-16). Se aplica después del join y de los filtros; `total` cuenta las filas
            conservadas y `truncado` indica si había más.
          enum:
            - 50
            - 100
            - 500
            - 1000
          example: 100
    PaginatedCrossJoinResultDto:
      type: object
      properties:
        total:
          type: number
          example: 128
          minimum: 0
        limit:
          type: number
          example: 50
          minimum: 1
          maximum: 1000
        offset:
          type: number
          example: 0
          minimum: 0
        data:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Filas combinadas; los nombres de propiedad dependen de las fuentes.
        limiteFilas:
          type: number
          example: 100
          enum:
            - 50
            - 100
            - 500
            - 1000
          description: Límite de filas pedido (RF-16)
        truncado:
          type: boolean
          example: true
          description: true si el resultado tenía más filas que limiteFilas
      required:
        - total
        - limit
        - offset
        - data
