            - AUTH_FAILED
            - DATABASE_NOT_FOUND
            - PERMISSION_DENIED
            - INVALID_CONFIGURATION
            - UNSUPPORTED_ENGINE
            - UNKNOWN
          example: AUTH_FAILED
