# Generado con `npm run openapi:generate` a partir del código. No editar a mano.
openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /auth/refresh:
    post:
      description: >-
        Devuelve un access token nuevo y un refresh token nuevo; el anterior deja de servir. Si la sesión lleva más de
        30 minutos sin actividad, venció o el refresh token ya se había usado, responde 401 y la sesión queda cerrada.
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '401':
          description: Sesión expirada, cerrada o refresh token inválido.
      summary: Renovar el access token con el refresh token (rotación)
      tags:
        - Auth
  /auth/logout:
    post:
      description: >-
        Revoca la sesión del refresh token: tanto el refresh token como los access tokens emitidos dejan de funcionar de
        inmediato. Es idempotente.
      operationId: AuthController_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '204':
          description: Sesión cerrada (o ya estaba cerrada).
      summary: Cerrar sesión
      tags:
        - Auth
  /auth/forgot-password:
    post:
      description: Envía un enlace de un solo uso que vence en 30 minutos. La respuesta es la misma exista o no el correo.
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
        '429':
          description: Demasiadas solicitudes. Intenta más tarde.
      summary: Solicitar enlace de recuperación de contraseña (RF-03)
      tags:
        - Auth
  /auth/reset-password:
    post:
      description: Consume el token (un solo uso) y guarda la nueva contraseña con bcrypt.
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
        '400':
          description: Token inválido, usado o expirado, o contraseña inválida.
        '429':
          description: Demasiadas solicitudes. Intenta más tarde.
      summary: Restablecer la contraseña con el token del correo
      tags:
        - Auth
  /auth/login:
    post:
      description: Valida las credenciales del usuario con bcrypt y devuelve un JWT firmado
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Autenticación exitosa. Retorna el token JWT y los datos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '401':
          description: Credenciales inválidas (email o contraseña incorrectos).
      summary: Iniciar sesión en DataNexus
      tags:
        - Auth
  /auth/signup:
    post:
      description: >-
        Crea el usuario (ADMIN) y su workspace e inicia sesión. PERSONAL admite cualquier correo y no tiene miembros;
        ORGANIZACION exige correo corporativo y deja su dominio como dominio permitido para invitar al equipo.
      operationId: AuthController_signup
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupDto'
      responses:
        '201':
          description: Cuenta creada; devuelve los tokens como el login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '409':
          description: Ya existe una cuenta con ese correo.
      summary: Crear una cuenta personal u organización
      tags:
        - Auth
  /auth/register:
    post:
      description: Crea un nuevo usuario en la base de datos con contraseña hasheada mediante bcrypt
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Usuario registrado exitosamente.
        '409':
          description: El correo electrónico ya se encuentra registrado.
      summary: Registrar un nuevo usuario
      tags:
        - Auth
  /auth/profile:
    get:
      description: Ruta protegida que valida el token JWT emitido
      operationId: AuthController_getProfile
      parameters: []
      responses:
        '200':
          description: Datos del usuario autenticado obtenidos desde el token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponseDto'
        '401':
          description: No autorizado / Token ausente o inválido
      security:
        - bearer: []
      summary: Consultar perfil del usuario autenticado
      tags:
        - Auth
    patch:
      description: El correo no se edita porque se usa para iniciar sesión.
      operationId: AccountController_updateProfile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponseDto'
        '401':
          description: Token JWT inválido o ausente.
      security:
        - bearer: []
      summary: Editar nombre y apellidos
      tags:
        - Auth
  /auth/change-password:
    post:
      description: Exige la contraseña actual, aplica la política de contraseñas y cierra las demás sesiones abiertas del usuario.
      operationId: AccountController_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '400':
          description: La nueva contraseña no cumple la política o es igual a la actual.
        '401':
          description: Token JWT inválido o ausente.
      security:
        - bearer: []
      summary: Cambiar la contraseña
      tags:
        - Auth
  /auth/sessions:
    get:
      description: Dispositivos con sesión activa; `actual` marca la de esta petición.
      operationId: AccountController_listSessions
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionResponseDto'
        '401':
          description: Token JWT inválido o ausente.
      security:
        - bearer: []
      summary: Mis sesiones abiertas
      tags:
        - Auth
  /auth/sessions/{id}:
    delete:
      operationId: AccountController_revokeSession
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedSessionsDto'
        '401':
          description: Token JWT inválido o ausente.
        '404':
          description: La sesión no existe, ya estaba cerrada o es de otro usuario.
      security:
        - bearer: []
      summary: Cerrar una de mis sesiones
      tags:
        - Auth
  /auth/tokens/scopes:
    get:
      description: '`disponible` indica si tu rol actual puede concederlo.'
      operationId: PersonalAccessTokensController_scopes
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatScopeDto'
        '401':
          description: Sesión inválida o ausente.
        '403':
          description: Los tokens de acceso personal no pueden gestionar tokens.
      security:
        - bearer: []
      summary: Permisos que puede tener un token
      tags:
        - Auth
  /auth/tokens:
    get:
      description: Activos y caducados, con su vencimiento y último uso. Nunca devuelve el token.
      operationId: PersonalAccessTokensController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalAccessTokenDto'
        '401':
          description: Sesión inválida o ausente.
        '403':
          description: Los tokens de acceso personal no pueden gestionar tokens.
      security:
        - bearer: []
      summary: Mis tokens de acceso personal
      tags:
        - Auth
    post:
      description: >-
        Devuelve el token completo **una sola vez**. Úsalo como `Authorization: Bearer pat_...`. Solo se pueden conceder
        permisos que tu rol tenga, y el token deja de servir para lo que tu rol pierda.
      operationId: PersonalAccessTokensController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonalAccessTokenDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedPersonalAccessTokenDto'
        '401':
          description: Sesión inválida o ausente.
        '403':
          description: Los tokens de acceso personal no pueden gestionar tokens.
      security:
        - bearer: []
      summary: Crear un token de acceso personal
      tags:
        - Auth
  /auth/tokens/{id}/rotate:
    post:
      description: Revoca el token y emite otro con el mismo nombre, permisos y duración. El nuevo se muestra una sola vez.
      operationId: PersonalAccessTokensController_rotate
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedPersonalAccessTokenDto'
        '401':
          description: Sesión inválida o ausente.
        '403':
          description: Los tokens de acceso personal no pueden gestionar tokens.
        '404':
          description: El token no existe, ya fue revocado o es de otro usuario.
      security:
        - bearer: []
      summary: Rotar un token
      tags:
        - Auth
  /auth/tokens/{id}:
    delete:
      description: Deja de funcionar al instante.
      operationId: PersonalAccessTokensController_revoke
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Token revocado.
        '401':
          description: Sesión inválida o ausente.
        '403':
          description: Los tokens de acceso personal no pueden gestionar tokens.
        '404':
          description: El token no existe, ya fue revocado o es de otro usuario.
      security:
        - bearer: []
      summary: Revocar un token
      tags:
        - Auth
  /audit/logs:
    get:
      description: >-
        Obtiene los registros de auditoría del workspace con paginación nativa (?page=1&limit=50) y filtros opcionales
        por fechaInicio, fechaFin y tipoAccion. Requiere rol ADMIN o AUDITOR.
      operationId: AuditController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Número de página
          schema:
            minimum: 1
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Cantidad de registros por página
          schema:
            minimum: 1
            maximum: 100
            default: 50
            example: 50
            type: number
        - name: fechaInicio
          required: false
          in: query
          description: Filtrar registros a partir de esta fecha (formato ISO 8601)
          schema:
            example: '2026-10-01T00:00:00.000Z'
            type: string
        - name: fechaFin
          required: false
          in: query
          description: Filtrar registros hasta esta fecha (formato ISO 8601)
          schema:
            example: '2026-10-31T23:59:59.999Z'
            type: string
        - name: tipoAccion
          required: false
          in: query
          description: Filtrar por tipo de acción o evento
          schema:
            example: CONNECTION_DELETED
            type: string
            enum:
              - LOGIN_SUCCESS
              - LOGIN_FAILURE
              - USER_ROLE_CHANGED
              - USER_INVITED
              - CONNECTION_CREATED
              - CONNECTION_UPDATED
              - CONNECTION_DELETED
              - REPORT_GENERATED_AND_SENT
              - EXECUTE_JOIN
              - EXPORT
              - MODIFY_RECORD
              - AUDIT_LOG_EXPORTED
              - PASSWORD_RESET_REQUESTED
              - PASSWORD_RESET
              - LOGOUT
              - SESSION_EXPIRED
              - REFRESH_TOKEN_REUSED
              - ACCOUNT_LOCKED
              - WORKSPACE_UPDATED
              - INVITATION_RESENT
              - INVITATION_REVOKED
              - INVITATION_ACCEPTED
              - USER_REMOVED
              - BROWSE_DATA
              - SAVED_QUERY_CREATED
              - SAVED_QUERY_UPDATED
              - SAVED_QUERY_DELETED
              - SCHEDULED_REPORT_CREATED
              - SCHEDULED_REPORT_UPDATED
              - SCHEDULED_REPORT_DELETED
              - SCHEDULED_REPORT_RUN
              - ACCOUNT_CREATED
              - PROFILE_UPDATED
              - PASSWORD_CHANGED
              - SESSIONS_REVOKED
              - PAT_CREATED
              - PAT_ROTATED
              - PAT_REVOKED
              - PAT_USED
              - EXCEL_UPLOADED
              - EXCEL_REPLACED
              - EXCEL_DELETED
        - name: impacto
          required: false
          in: query
          description: Nivel de impacto derivado del tipo de evento
          schema:
            type: string
            enum:
              - BAJO
              - MEDIO
              - ALTO
        - name: buscar
          required: false
          in: query
          description: Busca en el correo del usuario, la IP o el recurso afectado
          schema:
            example: ana@
            type: string
      responses:
        '200':
          description: Listado paginado de logs de auditoría.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogsResponseDto'
        '401':
          description: Token JWT inválido o ausente.
        '403':
          description: Se requiere rol ADMIN o AUDITOR para consultar los logs de auditoría.
      security:
        - bearer: []
      summary: Consultar logs de auditoría con paginación y filtros
      tags:
        - Audit
  /audit/summary:
    get:
      description: Eventos del período, usuarios con actividad, fallos, eventos por impacto y días de retención.
      operationId: AuditController_summary
      parameters:
        - name: dias
          required: false
          in: query
          description: Días hacia atrás (1 a 365)
          schema:
            example: 30
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditSummaryResponseDto'
      security:
        - bearer: []
      summary: Métricas de la bitácora
      tags:
        - Audit
  /audit/logs/{id}:
    get:
      description: De solo lectura. El payload nunca incluye credenciales ni tokens.
      operationId: AuditController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogEntryResponseDto'
        '404':
          description: El evento no existe o es de otro workspace.
      security:
        - bearer: []
      summary: Detalle de un evento (inspector)
      tags:
        - Audit
  /audit/logs/export:
    get:
      description: >-
        Descarga los registros del workspace con los mismos filtros que /audit/logs (máximo 10000 por archivo). La
        exportación queda registrada como AUDIT_LOG_EXPORTED. Requiere rol ADMIN o AUDITOR.
      operationId: AuditController_exportLogs
      parameters:
        - name: fechaInicio
          required: false
          in: query
          description: Filtrar registros a partir de esta fecha (formato ISO 8601)
          schema:
            example: '2026-10-01T00:00:00.000Z'
            type: string
        - name: fechaFin
          required: false
          in: query
          description: Filtrar registros hasta esta fecha (formato ISO 8601)
          schema:
            example: '2026-10-31T23:59:59.999Z'
            type: string
        - name: tipoAccion
          required: false
          in: query
          description: Filtrar por tipo de acción o evento
          schema:
            example: CONNECTION_DELETED
            type: string
            enum:
              - LOGIN_SUCCESS
              - LOGIN_FAILURE
              - USER_ROLE_CHANGED
              - USER_INVITED
              - CONNECTION_CREATED
              - CONNECTION_UPDATED
              - CONNECTION_DELETED
              - REPORT_GENERATED_AND_SENT
              - EXECUTE_JOIN
              - EXPORT
              - MODIFY_RECORD
              - AUDIT_LOG_EXPORTED
              - PASSWORD_RESET_REQUESTED
              - PASSWORD_RESET
              - LOGOUT
              - SESSION_EXPIRED
              - REFRESH_TOKEN_REUSED
              - ACCOUNT_LOCKED
              - WORKSPACE_UPDATED
              - INVITATION_RESENT
              - INVITATION_REVOKED
              - INVITATION_ACCEPTED
              - USER_REMOVED
              - BROWSE_DATA
              - SAVED_QUERY_CREATED
              - SAVED_QUERY_UPDATED
              - SAVED_QUERY_DELETED
              - SCHEDULED_REPORT_CREATED
              - SCHEDULED_REPORT_UPDATED
              - SCHEDULED_REPORT_DELETED
              - SCHEDULED_REPORT_RUN
              - ACCOUNT_CREATED
              - PROFILE_UPDATED
              - PASSWORD_CHANGED
              - SESSIONS_REVOKED
              - PAT_CREATED
              - PAT_ROTATED
              - PAT_REVOKED
              - PAT_USED
              - EXCEL_UPLOADED
              - EXCEL_REPLACED
              - EXCEL_DELETED
        - name: format
          required: false
          in: query
          schema:
            default: csv
            type: string
            enum:
              - csv
              - json
      responses:
        '200':
          description: >-
            Archivo descargable. El encabezado X-Audit-Export-Truncated vale "true" si había más registros que el
            máximo.
        '400':
          description: Formato o filtros inválidos.
        '401':
          description: Token JWT inválido o ausente.
        '403':
          description: Se requiere rol ADMIN o AUDITOR para exportar la bitácora.
      security:
        - bearer: []
      summary: Exportar la bitácora filtrada a CSV o JSON
      tags:
        - Audit
  /connections:
    post:
      description: >-
        El formato de `credenciales` depende de `tipoMotor`. Todo el payload se cifra con AES-256; la respuesta solo
        trae metadatos.
      operationId: ConnectionsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionDto'
      responses:
        '201':
          description: Conexión creada; las credenciales no se devuelven.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponseDto'
        '400':
          description: Credenciales incompletas, con campos de otro motor o inválidas.
        '403':
          description: Solo ADMIN puede crear conexiones.
      security:
        - bearer: []
      summary: Crear una conexión con credenciales estructuradas (RF-08)
      tags:
        - Connections
    get:
      operationId: ConnectionsController_findAll
      parameters: []
      responses:
        '200':
          description: Lista segura de conexiones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionResponseDto'
        '403':
          description: Se requiere rol ADMIN u OPERADOR para listar conexiones.
      security:
        - bearer: []
      summary: Listar conexiones del workspace autenticado (ADMIN u OPERADOR)
      tags:
        - Connections
  /connections/test:
    post:
      description: >-
        Conecta, autentica y consulta la versión del servidor midiendo la latencia. No persiste nada ni devuelve
        secretos. Un fallo de red o credenciales responde 200 con ok=false y un error normalizado por motor.
      operationId: ConnectionsController_testCredentials
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConnectionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResultDto'
        '400':
          description: Datos de conexión inválidos.
        '403':
          description: Solo ADMIN puede probar credenciales nuevas.
        '429':
          description: Máximo 10 pruebas por minuto.
      security:
        - bearer: []
      summary: Probar credenciales antes de guardar la conexión (RF-10)
      tags:
        - Connections
  /connections/{id}/test:
    post:
      description: >-
        Usa las credenciales cifradas de la conexión sin exponerlas. Un fallo de red o credenciales responde 200 con
        ok=false.
      operationId: ConnectionsController_testSaved
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionTestOptionsDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResultDto'
        '403':
          description: Se requiere rol ADMIN u OPERADOR.
        '404':
          description: Conexión no encontrada.
        '429':
          description: Máximo 10 pruebas por minuto.
      security:
        - bearer: []
      summary: Probar una conexión guardada y medir su latencia (RF-10)
      tags:
        - Connections
  /connections/firestore/databases:
    post:
      operationId: ConnectionsController_listFirestoreDatabases
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListFirestoreDatabasesDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirestoreDatabasesResponseDto'
      security:
        - bearer: []
      summary: Listar las bases Cloud Firestore del proyecto de la cuenta de servicio
      tags:
        - Connections
  /connections/firestore:
    post:
      description: >-
        multipart/form-data con el archivo `serviceAccount`. Se valida (type, project_id, private_key, client_email), se
        cifra y nunca se escribe en disco.
      operationId: ConnectionsController_createFirestore
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - serviceAccount
              properties:
                serviceAccount:
                  type: string
                  format: binary
                  description: Archivo JSON de Service Account (máx. 64 KB). Se procesa en memoria y nunca se escribe en disco.
                nombre:
                  type: string
                  maxLength: 120
                databaseId:
                  type: string
                  default: (default)
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponseDto'
        '400':
          description: Archivo ausente, no JSON o Service Account inválido.
        '413':
          description: El archivo supera 64 KB.
      security:
        - bearer: []
      summary: Crear una conexión Firestore subiendo el JSON de Service Account (RF-09)
      tags:
        - Connections
  /connections/{id}:
    get:
      operationId: ConnectionsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
