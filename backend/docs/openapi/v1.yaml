  /reports/download/{id}:
    get:
      description: >-
        Valida el enlace firmado de 24 horas y transmite el archivo desde almacenamiento local. Los reportes GCS usan su
        URL firmada directamente.
      operationId: ReportsController_downloadLocalReport
      parameters:
        - name: id
          required: true
          in: path
          description: UUID aleatorio del reporte
          schema:
            format: uuid
            type: string
        - name: filename
          required: true
          in: query
          description: Nombre del archivo incluido en el enlace firmado
          schema:
            type: string
        - name: expires
          required: true
          in: query
          description: Vencimiento del enlace en segundos Unix
          schema:
            type: string
        - name: signature
          required: true
          in: query
          description: Firma HMAC del enlace
          schema:
            type: string
      responses:
        '200':
          description: Archivo de reporte transmitido.
          content:
            application/json:
              schema:
                type: string
                format: binary
        '401':
          description: El enlace es inválido o expiró.
        '404':
          description: El reporte no existe en almacenamiento local.
