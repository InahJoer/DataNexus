      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedQueryVersionDto'
        '401':
          description: Token JWT inválido o ausente.
        '404':
          description: Consulta no encontrada.
      security:
        - bearer: []
