# PostgreSQL local para desarrollo de DataNexus.
#   docker compose up -d postgres
# Coincide con DATABASE_URL de .env.example.
services:
  postgres:
    image: postgres:16-alpine
    container_name: datanexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: datanexus
      POSTGRES_PASSWORD: datanexus
      POSTGRES_DB: datanexus
    ports:
      - '5432:5432'
    volumes:
      - datanexus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U datanexus -d datanexus']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datanexus-pgdata:
